<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 420" width="1400" height="420">
  <defs>
    <linearGradient id="bg" x1="0" x2="1">
      <stop offset="0" stop-color="#030712"/>
      <stop offset="0.55" stop-color="#071426"/>
      <stop offset="1" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="line" x1="0" x2="1">
      <stop offset="0" stop-color="#1677ff"/>
      <stop offset="0.55" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <path id="flow1" d="M90 285 C220 285 250 190 390 190 S570 190 650 235 S820 235 900 190 S1080 190 1300 235"/>
    <path id="flow2" d="M90 315 C220 315 260 235 400 235 S560 235 650 270 S820 270 920 225 S1080 225 1300 270"/>
  </defs>

  <rect width="1400" height="420" rx="24" fill="url(#bg)"/>
  <rect x="10" y="10" width="1380" height="400" rx="18" fill="none" stroke="#164e63" stroke-width="1"/>

  <!-- ambient grid -->
  <g opacity=".16" stroke="#38bdf8">
    <path d="M40 70H1360M40 110H1360M40 350H1360M40 380H1360"/>
    <path d="M120 45V390M300 45V390M500 45V390M700 45V390M900 45V390M1100 45V390M1280 45V390"/>
  </g>

  <!-- title -->
  <text x="700" y="62" text-anchor="middle" fill="#f8fafc" font-family="Arial, sans-serif" font-size="34" font-weight="700" letter-spacing="4">
    CRISLAINE GOMES
  </text>
  <text x="700" y="91" text-anchor="middle" fill="#22d3ee" font-family="Arial, sans-serif" font-size="15" font-weight="600" letter-spacing="5">
    DATA • BI • AUTOMAÇÃO • IA
  </text>

  <!-- stages -->
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <g>
      <rect x="55" y="145" width="180" height="72" rx="14" fill="#071426" stroke="#1677ff"/>
      <text x="145" y="175" fill="#60a5fa" font-size="17" font-weight="700">DADOS</text>
      <text x="145" y="197" fill="#94a3b8" font-size="12">fontes • APIs • SQL</text>
    </g>
    <g>
      <rect x="300" y="145" width="180" height="72" rx="14" fill="#071426" stroke="#22d3ee"/>
      <text x="390" y="175" fill="#22d3ee" font-size="17" font-weight="700">TRATAMENTO</text>
      <text x="390" y="197" fill="#94a3b8" font-size="12">Python • Pandas</text>
    </g>
    <g>
      <rect x="545" y="145" width="180" height="72" rx="14" fill="#071426" stroke="#22d3ee"/>
      <text x="635" y="175" fill="#67e8f9" font-size="17" font-weight="700">ANÁLISE</text>
      <text x="635" y="197" fill="#94a3b8" font-size="12">indicadores • insights</text>
    </g>
    <g>
      <rect x="790" y="145" width="180" height="72" rx="14" fill="#071426" stroke="#8b5cf6"/>
      <text x="880" y="175" fill="#a78bfa" font-size="17" font-weight="700">VISUALIZAÇÃO</text>
      <text x="880" y="197" fill="#94a3b8" font-size="12">Power BI • dashboards</text>
    </g>
    <g>
      <rect x="1035" y="145" width="180" height="72" rx="14" fill="#071426" stroke="#2dd4bf"/>
      <text x="1125" y="175" fill="#2dd4bf" font-size="17" font-weight="700">DECISÃO</text>
      <text x="1125" y="197" fill="#94a3b8" font-size="12">resultado • ação</text>
    </g>
  </g>

  <!-- flow lines -->
  <use href="#flow1" fill="none" stroke="url(#line)" stroke-width="2" opacity=".5"/>
  <use href="#flow2" fill="none" stroke="#22d3ee" stroke-width="1.5" opacity=".28"/>

  <!-- animated data particles -->
  <g fill="#7dd3fc" filter="url(#glow)">
    <circle r="4"><animateMotion dur="4s" repeatCount="indefinite"><mpath href="#flow1"/></animateMotion></circle>
    <circle r="3"><animateMotion dur="5.5s" begin="1s" repeatCount="indefinite"><mpath href="#flow1"/></animateMotion></circle>
    <circle r="4"><animateMotion dur="4.8s" begin="2.2s" repeatCount="indefinite"><mpath href="#flow1"/></animateMotion></circle>
    <circle r="3"><animateMotion dur="6s" begin=".5s" repeatCount="indefinite"><mpath href="#flow2"/></animateMotion></circle>
    <circle r="4"><animateMotion dur="5s" begin="2.8s" repeatCount="indefinite"><mpath href="#flow2"/></animateMotion></circle>
    <circle r="3"><animateMotion dur="4.2s" begin="1.7s" repeatCount="indefinite"><mpath href="#flow2"/></animateMotion></circle>
  </g>

  <!-- animated pulse -->
  <circle cx="90" cy="285" r="5" fill="#22d3ee">
    <animate attributeName="r" values="4;10;4" dur="1.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;.35;1" dur="1.5s" repeatCount="indefinite"/>
  </circle>

  <!-- footer metrics -->
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="170" y="345" fill="#22d3ee" font-size="20" font-weight="700">6 HOSPITAIS</text>
    <text x="470" y="345" fill="#a78bfa" font-size="20" font-weight="700">1.200+ HORAS</text>
    <text x="770" y="345" fill="#67e8f9" font-size="20" font-weight="700">PYTHON • SQL • BI</text>
    <text x="1070" y="345" fill="#2dd4bf" font-size="20" font-weight="700">AUTOMAÇÃO • IA</text>
    <text x="700" y="382" fill="#64748b" font-size="12" letter-spacing="2">DADOS → INSIGHT → DECISÃO</text>
  </g>
</svg>